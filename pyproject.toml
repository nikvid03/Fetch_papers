[tool.poetry]
name = "papers-fetcher"
version = "0.1.0"
description = "Fetch research papers with authors from pharmaceutical or biotech companies"
authors = ["Nikhil <vidyarthinikhil630@gmail.com>"]
readme = "README.md"
packages = [{include = "papers_fetcher"}]

[tool.poetry.dependencies]
python = "^3.8"
biopython = "^1.81"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.1"
black = "^23.3.0"
isort = "^5.12.0"
mypy = "^1.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
get-papers-list = "papers_fetcher.cli:main"

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true